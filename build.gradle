plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
}

base {
    archivesName = mod_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neoforge_version

    mods {
        extendedae {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()
        }

        server {
            server()
        }

        gametestWorld {
            client()
            programArguments.addAll("--username", "Dev", "--quickPlaySingleplayer", "GametestWorld")
        }

        clientData {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        serverData {
            serverData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        gametest {
            type = "gameTestServer"
            gameDirectory = project.file("build/gametest")
        }

    }

}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

// 26.3 port: integrations without a 26.3 build are excluded from compilation
sourceSets.main.java {
    exclude 'com/glodblock/github/extendedae/xmod/kjs/**'
    exclude 'com/glodblock/github/extendedae/xmod/appflux/**'
    exclude 'com/glodblock/github/extendedae/xmod/aae/**'
    exclude 'com/glodblock/github/extendedae/mixins/MixinEnderSavedData.java'
    exclude 'com/glodblock/github/extendedae/datagen/**'
}

repositories {
    mavenCentral()
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
        content {
            includeGroup "dev.emi"
        }
    }
    maven {
        name = 'cursemaven'
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
        authentication {
            header(HttpHeaderAuthentication)
        }
        credentials(HttpHeaderCredentials) {
            name = "x-api-key"
            value = System.getenv('CF_API_KEY')
        }
    }
    maven {
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'mezz.jei'
        }
    }
    maven {
        name = 'KubeJS'
        url = "https://maven.latvian.dev/releases/"
    }
    maven {
        url = uri("https://modmaven.dev/")
    }
    maven {
        url = "https://maven.shedaniel.me/"
    }
}

dependencies {
    implementation "io.github.glodblock:Glodium:26.3-1.0-neoforge"
    implementation "org.appliedenergistics:appliedenergistics2:26.3.2-alpha"
    implementation "org.appliedenergistics:guideme:26.3.7-alpha"
    jarJar(implementation ("de.mari_023:ae2wtlib_api:26.3.2-beta") { transitive = false })
    compileOnly "dev.external:jade:26.3.5"
    compileOnly "mezz.jei:jei-26.3-neoforge:31.18.0.127"
    // 26.3 builds not available yet - integrations disabled for this port
    //compileOnly "curse.maven:applied-flux-965012:9025081"
    //compileOnly "curse.maven:kubejs-238086:8235730"
    //compileOnly "dev.latvian.mods:rhino:2101.2.7-build.85"
    //compileOnly "curse.maven:advancedae-1084104:8236325"
    //compileOnly "curse.maven:functional-storage-556861:8723367"
    // runtime test
    runtimeOnly "mezz.jei:jei-26.3-neoforge:31.18.0.127"
    runtimeOnly ("de.mari_023:ae2wtlib:26.3.2-beta") { transitive = false }
    // setup Xei
    switch(use_Xei) {
        case "emi":
            //runtimeOnly "dev.emi:emi-neoforge:1.1.10+1.21"
            break
        case "rei":
            // 26.3 REI build not available yet
            break
        case "jei":
            runtimeOnly "mezz.jei:jei-26.3-neoforge:31.18.0.127"
            break
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_version         : neoforge_version, neo_version_range: neoforge_version_range,
            loader_version_range: loader_version_range,
            mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors         : mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }

    exclude(".cache/**")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.named('jar') {
    exclude 'com/glodblock/github/**/datagen/**'
}
